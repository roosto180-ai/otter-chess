name: Deploy docs site
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'otter-selfhost-source.zip'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore tested source bundle
        id: restore
        if: hashFiles('docs/lib/play/match-clock.ts') == ''
        run: |
          echo 'd93df572d5fac4be688e5077bf574ac2b505d9f971457abb2c1e96f259ebdf48  otter-selfhost-source.zip' | sha256sum -c -
          unzip -oq otter-selfhost-source.zip -d .
          mkdir -p docs/public/sources
          cp otter-selfhost-source.zip docs/public/sources/otter-selfhost-source.zip
          rm -f docs/public/policy_model.onnx
      - name: Keep adapted source available in the fork
        if: steps.restore.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs .gitattributes COPYING INFERENCE-PARITY.json MODIFICATIONS.md README.md README-AR.md Start-Otter.ps1 TEST-REPORT-AR.md
          if ! git diff --cached --quiet; then
            git commit -m 'Materialize tested Otter clock and continuation source'
            git push origin HEAD:main
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install dependencies
        working-directory: docs
        run: npm ci
      - name: Test clocks and continuation
        working-directory: docs
        run: npm test
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build static export with verified original model
        working-directory: docs
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
      - name: Disable Jekyll
        run: touch docs/out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

