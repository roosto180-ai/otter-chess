name: Deploy docs site
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'otter-selfhost-source.zip'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore tested source bundle
        id: restore
        run: |
          if [ -f otter-selfhost-source.zip ] && [ -f otter-selfhost-source.sha256 ]; then
            if ! cmp -s otter-selfhost-source.sha256 .github/materialized-source.sha256; then
              sha256sum -c otter-selfhost-source.sha256
              unzip -oq otter-selfhost-source.zip -d .
              mkdir -p docs/public/sources
              cp otter-selfhost-source.zip docs/public/sources/otter-selfhost-source.zip
              cp otter-selfhost-source.sha256 .github/materialized-source.sha256
              echo 'changed=true' >> "$GITHUB_OUTPUT"
            fi
          elif [ ! -f docs/lib/play/model-asset.ts ]; then
            echo 'Missing adapted source and verified source bundle' >&2
            exit 1
          fi
      - name: Keep adapted source available in the fork
        if: steps.restore.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs scripts .github/materialized-source.sha256 .gitattributes COPYING INFERENCE-PARITY.json MODIFICATIONS.md README.md README-AR.md Start-Otter.ps1 TEST-REPORT-AR.md FINETUNING-AR.md
          if ! git diff --cached --quiet; then
            git commit -m 'Materialize tested Otter training and model-selection source'
            git push origin HEAD:main
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install dependencies
        working-directory: docs
        run: npm ci
      - name: Test clocks, continuation and model-cache isolation
        working-directory: docs
        run: npm test
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build static export with verified original and trained models
        working-directory: docs
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
      - name: Disable Jekyll
        run: touch docs/out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
